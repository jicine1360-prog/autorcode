[project]
name = "autorcode"
version = "2.2.0"
description = "모델 라우팅 + 도구 실행 하네스 — ollama 스타일 로컬 에이전트 CLI (autorcode)"
requires-python = ">=3.9"

[project.scripts]
autorcode = "harness.cli:main"

[project.optional-dependencies]
tui = ["textual>=0.60"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["harness"]
